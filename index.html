<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1000×1000 Pixel Canvas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:#1b1b1f; color:#eee; font:14px system-ui,sans-serif; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:8px 12px; background:#26262c; border-bottom:1px solid #000; }
  header h1 { font-size:16px; margin:0; }
  #palette { display:flex; flex-wrap:wrap; gap:3px; }
  .sw { width:22px; height:22px; border:2px solid #0006; border-radius:4px; cursor:pointer; padding:0; }
  .sw.sel { border-color:#fff; transform:scale(1.15); }
  button.act { background:#3b82f6; color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:14px; }
  button.act:disabled { background:#444; color:#888; cursor:not-allowed; }
  button.sm { background:#3a3a42; color:#eee; border:0; border-radius:6px; width:30px; height:30px; cursor:pointer; font-size:16px; }
  #status { margin-left:auto; color:#aaa; }
  #view { flex:1; position:relative; overflow:hidden; cursor:grab; touch-action:none; background:#111; }
  #view.drag { cursor:grabbing; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  canvas { display:block; image-rendering:pixelated; background:#fff; }
  #sel { position:absolute; border:1px solid #f0f; outline:1px solid #fff; pointer-events:none; display:none; }
  #msg { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:8px; display:none; max-width:90%; }
</style>
</head>
<body>
<header>
  <h1>1000×1000 Pixel Canvas</h1>
  <div id="palette"></div>
  <button class="act" id="place" disabled>Place pixel</button>
  <button class="sm" id="zin" title="Zoom in">+</button>
  <button class="sm" id="zout" title="Zoom out">−</button>
  <span id="status">Connecting…</span>
</header>
<div id="view">
  <div id="stage">
    <canvas id="cv" width="1000" height="1000"></canvas>
    <div id="sel"></div>
  </div>
  <div id="msg"></div>
</div>

<script type="module">

const MAX = 5, SIZE = 1000;
const COLORS = ["#ffffff","#e4e4e4","#888888","#222222","#ffa7d1","#e50000","#e59500","#a06a42",
                "#e5d900","#94e044","#02be01","#00d3dd","#0083c7","#0000ea","#cf6ee4","#820080"];

const $ = id => document.getElementById(id);
const view = $("view"), stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d"),
      selEl = $("sel"), placeBtn = $("place"), statusEl = $("status"), msgEl = $("msg");

// ---- palette ----
let color = 5;
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "sw" + (i === color ? " sel" : ""); b.style.background = c;
  b.onclick = () => { color = i; document.querySelectorAll(".sw").forEach((s, j) => s.classList.toggle("sel", j === i)); };
  $("palette").appendChild(b);
});

function toast(t) { msgEl.textContent = t; msgEl.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => msgEl.style.display = "none", 3500); }

// ---- pan / zoom ----
let scale = 1, tx = 0, ty = 0;
function apply() { stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit() {
  scale = Math.max(0.2, Math.min(view.clientWidth, view.clientHeight) / SIZE);
  tx = (view.clientWidth - SIZE * scale) / 2; ty = (view.clientHeight - SIZE * scale) / 2; apply();
}
function zoomAt(f, cx, cy) {
  const ns = Math.min(60, Math.max(0.2, scale * f)), r = ns / scale;
  tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; scale = ns; apply();
}
view.addEventListener("wheel", e => { e.preventDefault(); const r = view.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$("zin").onclick = () => zoomAt(1.5, view.clientWidth / 2, view.clientHeight / 2);
$("zout").onclick = () => zoomAt(1 / 1.5, view.clientWidth / 2, view.clientHeight / 2);

const pts = new Map(); let moved = false, lastPinch = 0;
view.addEventListener("pointerdown", e => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); moved = false; view.classList.add("drag"); });
view.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (lastPinch) { const r = view.getBoundingClientRect(); zoomAt(d / lastPinch, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top); }
    lastPinch = d; moved = true; return;
  }
  const dx = e.clientX - prev.clientX, dy = e.clientY - prev.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 0) { if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) moved = true; }
  if (moved) { tx += dx; ty += dy; apply(); }
});
let downX = 0, downY = 0;
view.addEventListener("pointerdown", e => { downX = e.clientX; downY = e.clientY; }, true);
function up(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); lastPinch = 0; view.classList.remove("drag");
  if (!moved && e.type === "pointerup" && pts.size === 0) selectAt(e.clientX, e.clientY);
}
view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);

// ---- selection ----
let sel = null;
function selectAt(cx, cy) {
  const r = view.getBoundingClientRect();
  const x = Math.floor((cx - r.left - tx) / scale), y = Math.floor((cy - r.top - ty) / scale);
  if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) { sel = null; selEl.style.display = "none"; updateUI(); return; }
  sel = { x, y };
  Object.assign(selEl.style, { display: "block", left: x + "px", top: y + "px", width: "1px", height: "1px", borderWidth: (1 / scale) + "px", outlineWidth: (1 / scale) + "px" });
  updateUI();
}

// ---- backend (Cloudflare Worker) ----
import { API_URL } from "./config.js";
let used = 0, ready = false, lastId = 0;
const taken = new Set();

function updateUI() {
  const left = MAX - used;
  statusEl.textContent = !ready ? "Connecting…" : `${left} of ${MAX} pixels left` + (sel ? ` · (${sel.x}, ${sel.y})` : "");
  const occupied = sel && taken.has(sel.x + "_" + sel.y);
  placeBtn.disabled = !(ready && left > 0 && sel && !occupied);
  placeBtn.textContent = occupied ? "Pixel taken" : "Place pixel";
}

ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, SIZE, SIZE);
fit(); window.addEventListener("resize", fit);

function draw(x, y, c) { taken.add(x + "_" + y); ctx.fillStyle = COLORS[c] || "#000"; ctx.fillRect(x, y, 1, 1); }

async function sync() {
  try {
    let more = true;
    while (more) {
      const r = await (await fetch(`${API_URL}/pixels?since=${lastId}`)).json();
      for (let i = 0; i < r.p.length; i += 4) { draw(r.p[i + 1], r.p[i + 2], r.p[i + 3]); lastId = r.p[i]; }
      more = r.more;
    }
    if (!ready) {
      used = (await (await fetch(`${API_URL}/me`)).json()).used; ready = true;
    }
    updateUI();
  } catch (e) { statusEl.textContent = "Connection problem – retrying…"; }
}

if (API_URL.includes("YOUR-SUBDOMAIN")) {
  statusEl.textContent = "Not configured – see README.md";
} else {
  sync(); setInterval(sync, 3000);
  placeBtn.onclick = async () => {
    if (!sel) return;
    const { x, y } = sel; placeBtn.disabled = true;
    try {
      const res = await fetch(`${API_URL}/place`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ x, y, c: color }) });
      const r = await res.json();
      if (r.used !== undefined) used = r.used;
      if (res.ok) { draw(x, y, color); toast("Pixel placed!"); }
      else { if (res.status === 409) taken.add(x + "_" + y); toast(r.error || "Couldn't place pixel"); }
    } catch (e) { toast("Network error"); }
    updateUI();
  };
}
updateUI();
</script>
</body>
</html>

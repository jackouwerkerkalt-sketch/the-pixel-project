<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1000×1000 Pixel Canvas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:#1b1b1f; color:#eee; font:14px system-ui,sans-serif; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:8px 12px; background:#26262c; border-bottom:1px solid #000; }
  header h1 { font-size:16px; margin:0; }
  #palette { display:flex; flex-wrap:wrap; gap:3px; }
  .sw { width:22px; height:22px; border:2px solid #0006; border-radius:4px; cursor:pointer; padding:0; }
  .sw.sel { border-color:#fff; transform:scale(1.15); }
  button.act { background:#3b82f6; color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:14px; }
  button.act:disabled { background:#444; color:#888; cursor:not-allowed; }
  button.sm { background:#3a3a42; color:#eee; border:0; border-radius:6px; width:30px; height:30px; cursor:pointer; font-size:16px; }
  #colorBtn { display:flex; align-items:center; gap:6px; background:#3a3a42; color:#eee; border:0; border-radius:6px; padding:4px 10px 4px 5px; cursor:pointer; font:13px ui-monospace,monospace; }
  #colorSw { width:22px; height:22px; border-radius:4px; border:2px solid #fff6; }
  #picker { display:none; position:fixed; z-index:10; top:50px; left:12px; width:250px; padding:12px; background:#26262c; border:1px solid #000; border-radius:10px; box-shadow:0 8px 24px #000a; flex-direction:column; gap:8px; }
  #picker.open { display:flex; }
  #picker .row { display:flex; align-items:center; gap:8px; }
  #picker label { width:46px; white-space:nowrap; font:13px ui-monospace,monospace; color:#aaa; }
  #eyedrop { display:none; background:#3b82f6; color:#fff; border:0; border-radius:6px; padding:7px 10px; cursor:pointer; font-size:13px; }
  #eyedrop.ok { display:block; }
  #eyedrop:disabled { background:#444; color:#999; cursor:wait; }
  #picker input[type=color] { width:100%; height:90px; border:0; padding:0; background:none; cursor:pointer; }
  #picker input[type=range] { flex:1; min-width:0; }
  #picker input[type=number], #picker #hex { width:64px; background:#1b1b1f; color:#eee; border:1px solid #444; border-radius:5px; padding:4px 6px; font:13px ui-monospace,monospace; }
  #picker #hex { flex:1; width:auto; text-transform:uppercase; }
  #picker #hex.bad { border-color:#e55; }
  #adminPanel { display:none; position:fixed; z-index:10; top:50px; left:12px; width:270px; padding:12px; background:#26262c; border:1px solid #7c3aed; border-radius:10px; box-shadow:0 8px 24px #000a; flex-direction:column; gap:8px; }
  #adminPanel.open { display:flex; }
  #adminPanel button { background:#3a3a42; color:#eee; border:0; border-radius:6px; padding:7px 10px; cursor:pointer; font-size:13px; text-align:left; }
  #adminPanel button.on { background:#d33; }
  #adminPanel button.go { background:#7c3aed; }
  #adminPanel .hint { color:#999; font-size:12px; }
  #adminPanel .row { display:flex; align-items:center; gap:8px; }
  #adminPanel input[type=number] { width:80px; background:#1b1b1f; color:#eee; border:1px solid #444; border-radius:5px; padding:4px 6px; font:13px ui-monospace,monospace; }
  #adminPanel .chk { font-size:13px; display:flex; gap:6px; align-items:center; }
  #status { margin-left:auto; color:#aaa; }
  #view { flex:1; position:relative; overflow:hidden; cursor:grab; touch-action:none; background:#111; }
  #view.drag { cursor:grabbing; }
  #view.erasing, #view.drawing { cursor:crosshair; }
  #drawBtn.on { background:#16a34a !important; }
  #eraseBtn.on { background:#d33 !important; }
  #disp { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  #msg { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:8px; display:none; max-width:90%; }
</style>
</head>
<body>
<header>
  <h1>1000×1000 Pixel Canvas</h1>
  <div id="palette"></div>
  <button id="colorBtn" title="Custom color"><span id="colorSw"></span><span id="colorHex">#E50000</span></button>
  <button class="act" id="drawBtn" style="background:#3a3a42" title="Drag to paint pixels instead of moving the canvas (B). Hold Space or use right/middle mouse to pan.">Drag: move</button>
  <button class="act" id="eraseBtn" style="background:#3a3a42" title="Erase your own pixels (E)">Eraser: off</button>
  <button class="act" id="gridBtn" style="background:#3a3a42">Grid: off</button>
  <button class="act" id="adminBtn" style="display:none;background:#7c3aed">Admin</button>
  <button class="sm" id="zin" title="Zoom in">+</button>
  <button class="sm" id="zout" title="Zoom out">−</button>
  <span id="status">Connecting…</span>
</header>
<div id="picker">
  <button id="eyedrop" title="Pick a color from anywhere on your screen, including other windows">Pick from screen</button>
  <input type="color" id="cpick">
  <div class="row"><label>Hex&nbsp;#</label><input id="hex" maxlength="7" spellcheck="false" autocomplete="off"></div>
  <div class="row"><label style="color:#f66">R</label><input type="range" id="rr" min="0" max="255"><input type="number" id="rn" min="0" max="255"></div>
  <div class="row"><label style="color:#6d6">G</label><input type="range" id="gr" min="0" max="255"><input type="number" id="gn" min="0" max="255"></div>
  <div class="row"><label style="color:#69f">B</label><input type="range" id="br" min="0" max="255"><input type="number" id="bn" min="0" max="255"></div>
</div>
<div id="adminPanel">
  <b>Admin</b><span class="hint">Unlimited pixels. Eraser and area erase work on anyone's pixels.</span>
  <button id="areaBtn">Erase area: off</button>
  <button id="impPick">Import image…</button>
  <input type="file" id="impFile" accept="image/*" style="display:none">
  <div id="impOpts" style="display:none">
    <div class="row"><label>Width</label><input type="number" id="impW" min="1" max="1000"><span class="hint">px</span></div>
    <label class="chk"><input type="checkbox" id="impOver"> Overwrite existing pixels</label>
    <div class="hint" id="impInfo"></div>
    <button id="impGo" class="go">Choose where to place it</button>
  </div>
  <button id="admOut">Lock admin</button>
</div>
<div id="view">
  <canvas id="disp"></canvas>
  <div id="msg"></div>
</div>

<script type="module">

const MAX = 1000, SIZE = 1000;
const COLORS = ["#ffffff","#e4e4e4","#888888","#222222","#ffa7d1","#e50000","#e59500","#a06a42",
                "#e5d900","#94e044","#02be01","#00d3dd","#0083c7","#0000ea","#cf6ee4","#820080"];

// pixel colors are 24-bit RGB ints (0xRRGGBB); -1 = untouched (white)
const pack = c => (0xff000000 | ((c & 255) << 16) | (c & 0xff00) | (c >> 16)) >>> 0;   // -> canvas ABGR
const WHITE = 0xffffffff, BG = 0xff111111 >>> 0;
const colors = new Int32Array(SIZE * SIZE).fill(-1);
let img = null, buf = null;
const $ = id => document.getElementById(id);
const view = $("view"), disp = $("disp"), dctx = disp.getContext("2d"),
      statusEl = $("status"), msgEl = $("msg");

// ---- palette ----
let color = 0xe50000;
const hexOf = c => "#" + c.toString(16).padStart(6, "0");
const swatches = [];
COLORS.forEach(h => {
  const b = document.createElement("button");
  b.className = "sw"; b.style.background = h; b.title = h;
  b.onclick = () => setColor(parseInt(h.slice(1), 16));
  $("palette").appendChild(b); swatches.push(b);
});

// ---- color picker: native picker + hex + RGB ----
const picker = $("picker"), hexIn = $("hex"), cpick = $("cpick");
const rgbIn = ["r", "g", "b"].map(k => ({ num: $(k + "n"), rng: $(k + "r") }));
function setColor(c, skip) {
  color = c & 0xffffff;
  const h = hexOf(color);
  $("colorSw").style.background = h; $("colorHex").textContent = h.toUpperCase();
  if (skip !== "hex") hexIn.value = h.slice(1).toUpperCase();
  if (skip !== "cpick") cpick.value = h;
  [color >> 16, (color >> 8) & 255, color & 255].forEach((v, i) => {
    if (skip !== "rgb" + i) { rgbIn[i].num.value = v; }
    rgbIn[i].rng.value = v;
  });
  swatches.forEach((b, i) => b.classList.toggle("sel", parseInt(COLORS[i].slice(1), 16) === color));
  redraw();
}
// eyedropper: grab a color from anywhere on screen, even other windows/apps (Chromium browsers only)
if ("EyeDropper" in window) {
  $("eyedrop").classList.add("ok");
  $("eyedrop").onclick = async () => {
    const btn = $("eyedrop"); btn.disabled = true; btn.textContent = "Click anywhere on screen… (Esc cancels)";
    try { const r = await new EyeDropper().open(); setColor(parseInt(r.sRGBHex.slice(1), 16)); }
    catch (e) { /* cancelled */ }
    btn.disabled = false; btn.textContent = "Pick from screen";
  };
}
$("colorBtn").onclick = e => { e.stopPropagation(); picker.classList.toggle("open"); };
document.addEventListener("pointerdown", e => { if (!picker.contains(e.target) && !$("colorBtn").contains(e.target)) picker.classList.remove("open"); });
cpick.oninput = () => setColor(parseInt(cpick.value.slice(1), 16), "cpick");
hexIn.oninput = () => {
  let v = hexIn.value.trim().replace(/^#/, "");
  if (/^[0-9a-f]{3}$/i.test(v)) v = v.split("").map(ch => ch + ch).join("");
  hexIn.classList.toggle("bad", !/^[0-9a-f]{6}$/i.test(v));
  if (/^[0-9a-f]{6}$/i.test(v)) setColor(parseInt(v, 16), "hex");
};
hexIn.onblur = () => { hexIn.classList.remove("bad"); hexIn.value = hexOf(color).slice(1).toUpperCase(); };
rgbIn.forEach((o, i) => {
  const set = v => {
    v = Math.max(0, Math.min(255, Math.round(+v) || 0));
    const ch = [color >> 16, (color >> 8) & 255, color & 255]; ch[i] = v;
    setColor((ch[0] << 16) | (ch[1] << 8) | ch[2], "rgb" + i);
  };
  o.rng.oninput = () => set(o.rng.value);
  o.num.oninput = () => { if (o.num.value !== "") set(o.num.value); };
  o.num.onblur = () => { o.num.value = [color >> 16, (color >> 8) & 255, color & 255][i]; };
});
for (const el of [hexIn, ...rgbIn.map(o => o.num)]) el.addEventListener("keydown", e => e.stopPropagation());  // don't trigger map shortcuts while typing

function toast(t) { msgEl.textContent = t; msgEl.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => msgEl.style.display = "none", 3500); }

// ---- view: one viewport-sized canvas, only visible pixels are drawn ----
let adminOn = false, adminToken = "", areaMode = false, area = null, impMode = false, imp = null, impCv = null, impPos = null;
let drawMode = false, stroke = null, spaceHeld = false; const strokeQueue = [];
let eraseMode = false; const mine = new Set();   // mine: y*SIZE+x of pixels I placed
let scale = 1, tx = 0, ty = 0, gridOn = false, sel = null, dpr = 1, raf = 0;
const MINZ = 0.2, MAXZ = 80;

function render() {
  raf = 0;
  const w = view.clientWidth, h = view.clientHeight, W = disp.width, H = disp.height;
  if (!img || img.width !== W || img.height !== H) { img = dctx.createImageData(W, H); buf = new Uint32Array(img.data.buffer); }
  buf.fill(BG);
  const s = scale * dpr, ox = tx * dpr, oy = ty * dpr;
  const x0 = Math.max(0, Math.floor(-ox / s)), x1 = Math.min(SIZE, Math.ceil((W - ox) / s));
  const y0 = Math.max(0, Math.floor(-oy / s)), y1 = Math.min(SIZE, Math.ceil((H - oy) / s));
  if (x1 > x0 && y1 > y0) {
    const clampX = v => Math.max(0, Math.min(W, v)), clampY = v => Math.max(0, Math.min(H, v));
    const bx = new Int32Array(x1 - x0 + 1);                    // device-pixel column edges: same rounding as the grid
    for (let x = x0; x <= x1; x++) bx[x - x0] = Math.round(ox + x * s);
    if (s >= 1) {
      for (let y = y0; y < y1; y++) {
        const yl = clampY(Math.round(oy + y * s)), yr = clampY(Math.round(oy + (y + 1) * s));
        if (yr <= yl) continue;
        const row = yl * W, base = y * SIZE;
        for (let x = x0; x < x1; x++) {
          const xl = clampX(bx[x - x0]), xr = clampX(bx[x - x0 + 1]); if (xr <= xl) continue;
          const c = colors[base + x]; buf.fill(c < 0 ? WHITE : pack(c), row + xl, row + xr);
        }
        for (let r = yl + 1; r < yr; r++) buf.copyWithin(r * W, row, row + W);
      }
    } else {                                                   // zoomed out: every pixel keeps its exact color, at least 1 device px
      const L = clampX(Math.round(ox + x0 * s)), R = clampX(Math.round(ox + x1 * s));
      const T = clampY(Math.round(oy + y0 * s)), B = clampY(Math.round(oy + y1 * s));
      for (let r = T; r < B; r++) buf.fill(WHITE, r * W + L, r * W + R);
      for (let y = y0; y < y1; y++) {
        const yl = Math.round(oy + y * s), yr = Math.max(yl + 1, Math.round(oy + (y + 1) * s)), base = y * SIZE;
        if (yr <= 0 || yl >= H) continue;
        for (let x = x0; x < x1; x++) {
          const c = colors[base + x]; if (c < 0) continue;
          const xl = bx[x - x0], xr = Math.max(xl + 1, bx[x - x0 + 1]);
          const cl = clampX(xl), cr = clampX(xr); if (cr <= cl) continue;
          for (let r = clampY(yl); r < clampY(yr); r++) buf.fill(pack(c), r * W + cl, r * W + cr);
        }
      }
    }
  }
  dctx.putImageData(img, 0, 0);
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (gridOn && scale >= 6 && x1 > x0 && y1 > y0) {
    dctx.strokeStyle = "rgba(0,0,0,0.3)"; dctx.lineWidth = 1; dctx.beginPath();
    for (let x = x0; x <= x1; x++) { const px = Math.round(tx + x * scale) + 0.5; dctx.moveTo(px, ty + y0 * scale); dctx.lineTo(px, ty + y1 * scale); }
    for (let y = y0; y <= y1; y++) { const py = Math.round(ty + y * scale) + 0.5; dctx.moveTo(tx + x0 * scale, py); dctx.lineTo(tx + x1 * scale, py); }
    dctx.stroke();
  }
  if (eraseMode && mine.size) {                                // show which pixels are yours (the only ones you can erase)
    dctx.lineWidth = 1; dctx.strokeStyle = "#ff2d2d"; const m = Math.max(scale, 5);
    for (const k of mine) {
      const x = k % SIZE, y = (k - x) / SIZE;
      if (x < x0 || x >= x1 || y < y0 || y >= y1) continue;
      const cx = tx + (x + 0.5) * scale, cy = ty + (y + 0.5) * scale;
      dctx.strokeRect(Math.round(cx - m / 2) + 0.5, Math.round(cy - m / 2) + 0.5, m, m);
    }
  }
  if (area) {                                                  // admin: area-erase rectangle
    const ax0 = Math.min(area.a.x, area.b.x), ax1 = Math.max(area.a.x, area.b.x), ay0 = Math.min(area.a.y, area.b.y), ay1 = Math.max(area.a.y, area.b.y);
    const rx = tx + ax0 * scale, ry = ty + ay0 * scale, rw = (ax1 - ax0 + 1) * scale, rh = (ay1 - ay0 + 1) * scale;
    dctx.fillStyle = "rgba(255,0,0,0.22)"; dctx.fillRect(rx, ry, rw, rh);
    dctx.lineWidth = 2; dctx.strokeStyle = "#f33"; dctx.setLineDash([6, 4]); dctx.strokeRect(rx, ry, rw, rh); dctx.setLineDash([]);
  }
  if (impMode && imp && impPos) {                              // admin: ghost of the image being placed
    const gx = tx + impPos.x * scale, gy = ty + impPos.y * scale;
    dctx.imageSmoothingEnabled = false; dctx.globalAlpha = 0.8;
    dctx.drawImage(impCv, gx, gy, imp.w * scale, imp.h * scale); dctx.globalAlpha = 1;
    dctx.lineWidth = 2; dctx.strokeStyle = "#7c3aed"; dctx.strokeRect(gx, gy, imp.w * scale, imp.h * scale);
  }
  if (sel) {
    const px = tx + sel.x * scale, py = ty + sel.y * scale;
    const taken_ = taken.has(sel.x + "_" + sel.y);
    if (!taken_ && scale >= 2) { dctx.fillStyle = hexOf(color); dctx.fillRect(px, py, scale, scale); }   // preview of your color, exact pixel size
    if (scale >= 4) {                                          // thin outline hugging the pixel
      dctx.lineWidth = 1; dctx.strokeStyle = "#000"; dctx.strokeRect(px - 0.5, py - 0.5, scale + 1, scale + 1);
      dctx.strokeStyle = "#fff"; dctx.strokeRect(px - 1.5, py - 1.5, scale + 3, scale + 3);
    } else {                                                   // zoomed out: crosshair ticks that leave the pixel visible
      const cx = px + scale / 2, cy = py + scale / 2, g = 6, l = 12;
      for (const [w, c] of [[3, "#fff"], [1, "#000"]]) {
        dctx.lineWidth = w; dctx.strokeStyle = c; dctx.beginPath();
        dctx.moveTo(cx - g - l, cy); dctx.lineTo(cx - g, cy); dctx.moveTo(cx + g, cy); dctx.lineTo(cx + g + l, cy);
        dctx.moveTo(cx, cy - g - l); dctx.lineTo(cx, cy - g); dctx.moveTo(cx, cy + g); dctx.lineTo(cx, cy + g + l);
        dctx.stroke();
      }
    }
  }
}
function redraw() { if (!raf) raf = requestAnimationFrame(render); }

function resize() {
  dpr = window.devicePixelRatio || 1;
  disp.width = Math.round(view.clientWidth * dpr); disp.height = Math.round(view.clientHeight * dpr);
  redraw();
}
function fit() {
  scale = Math.max(MINZ, Math.min(view.clientWidth, view.clientHeight) / SIZE);
  tx = (view.clientWidth - SIZE * scale) / 2; ty = (view.clientHeight - SIZE * scale) / 2; redraw();
}
function clampPan() {
  const w = view.clientWidth, h = view.clientHeight, m = 60;
  tx = Math.min(w - m, Math.max(m - SIZE * scale, tx));
  ty = Math.min(h - m, Math.max(m - SIZE * scale, ty));
}
function zoomAt(f, cx, cy) {
  const ns = Math.min(MAXZ, Math.max(MINZ, scale * f)), r = ns / scale;
  tx = cx - (cx - tx) * r; ty = cy - (cy - ty) * r; scale = ns; clampPan(); redraw();
}
const center = () => [view.clientWidth / 2, view.clientHeight / 2];
function setGrid(on) {
  gridOn = on; $("gridBtn").textContent = "Grid: " + (on ? "on" : "off");
  if (on && scale < 6) zoomAt(6 / scale, ...center()); else redraw();
}
$("gridBtn").onclick = () => setGrid(!gridOn);
$("zin").onclick = () => zoomAt(1.5, ...center());
$("zout").onclick = () => zoomAt(1 / 1.5, ...center());

view.addEventListener("wheel", e => {
  e.preventDefault();
  const r = view.getBoundingClientRect(), unit = e.deltaMode === 1 ? 16 : 1;
  const k = e.ctrlKey ? 0.01 : 0.0015;                       // trackpad pinch is sent as ctrl+wheel
  zoomAt(Math.exp(-Math.max(-120, Math.min(120, e.deltaY * unit)) * k * (e.ctrlKey ? 1 : 1.6)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

// pointers: drag to pan, pinch to zoom, click to select, double-click to zoom in
const pts = new Map(); let moved = false, start = null, lastPinch = 0;
const pixAt = e => { const r = view.getBoundingClientRect(); return { x: Math.max(0, Math.min(SIZE - 1, Math.floor((e.clientX - r.left - tx) / scale))), y: Math.max(0, Math.min(SIZE - 1, Math.floor((e.clientY - r.top - ty) / scale))) }; };
view.addEventListener("pointerdown", e => {
  if (areaMode && pts.size === 0 && e.button === 0) area = { a: pixAt(e), b: pixAt(e) };
  if (drawActive() && pts.size === 0 && e.button === 0 && !spaceHeld) { stroke = { last: null, warned: false }; extendStroke(pixAt(e)); }
  view.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { start = { x: e.clientX, y: e.clientY }; moved = false; }
  view.classList.add("drag");
});
view.addEventListener("pointermove", e => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (area) { area.b = pixAt(e); redraw(); return; }
  if (stroke && pts.size < 2) { extendStroke(pixAt(e)); return; }
  if (stroke) stroke = null;                                 // second finger: switch to pinch zoom
  if (pts.size >= 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = view.getBoundingClientRect();
    if (lastPinch) zoomAt(d / lastPinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    lastPinch = d; moved = true; return;
  }
  if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 4) moved = true;
  if (moved) { tx += dx; ty += dy; clampPan(); redraw(); }
});
function up(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); lastPinch = 0;
  if (pts.size === 1) moved = true;                         // finger left after a pinch: don't treat as a click
  if (pts.size === 0) {
    view.classList.remove("drag");
    if (stroke) { stroke = null; flushStrokes(); }
    else if (area) { if (e.type === "pointerup") finishArea(); else { area = null; redraw(); } }
    else if (!moved && e.type === "pointerup") selectAt(e.clientX, e.clientY);
  }
}
view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
view.addEventListener("contextmenu", e => { if (drawMode) e.preventDefault(); });
view.addEventListener("dblclick", e => { const r = view.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });

addEventListener("keyup", e => { if (e.code === "Space") { spaceHeld = false; e.preventDefault(); } });
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const step = 80, k = e.key.toLowerCase();
  if (e.code === "Space") { spaceHeld = true; e.preventDefault(); return; }
  if (k === "b") return setDraw(!drawMode);
  if (e.shiftKey && k === "a") { adminOn ? toggleAdminPanel() : unlockAdmin(); return; }
  if (k === "escape") { if (impMode) cancelImport(); if (areaMode) setArea(false); picker.classList.remove("open"); return; }
  if (k === "g") setGrid(!gridOn);
  else if (k === "e") setErase(!eraseMode);
  else if (k === "arrowleft" || k === "a") tx += step;
  else if (k === "arrowright" || k === "d") tx -= step;
  else if (k === "arrowup" || k === "w") ty += step;
  else if (k === "arrowdown" || k === "s") ty -= step;
  else if (k === "+" || k === "=") return zoomAt(1.5, ...center());
  else if (k === "-") return zoomAt(1 / 1.5, ...center());
  else if (k === "0") return fit();
  else return;
  clampPan(); redraw();
});

view.addEventListener("pointermove", e => {                  // hover preview of the pixel you're about to place
  if (impMode && e.pointerType === "mouse" && !pts.size) { impPos = impOrigin(pixAt(e)); redraw(); return; }
  if (pts.size || e.pointerType !== "mouse") return;
  let n = null;
  if (!eraseMode && scale >= 8) {
    const r = view.getBoundingClientRect(), x = Math.floor((e.clientX - r.left - tx) / scale), y = Math.floor((e.clientY - r.top - ty) / scale);
    if (x >= 0 && y >= 0 && x < SIZE && y < SIZE) n = { x, y };
  }
  if ((n && n.x) !== (sel && sel.x) || (n && n.y) !== (sel && sel.y) || !n !== !sel) { sel = n; redraw(); updateUI(); }
});
view.addEventListener("pointerleave", () => { if (sel) { sel = null; redraw(); updateUI(); } });

function selectAt(cx, cy) {
  const r = view.getBoundingClientRect();
  const x = Math.floor((cx - r.left - tx) / scale), y = Math.floor((cy - r.top - ty) / scale);
  if (impMode) { impPos = impOrigin(pixAt({ clientX: cx, clientY: cy })); redraw(); confirmImport(); return; }
  if (eraseMode) { if (x >= 0 && y >= 0 && x < SIZE && y < SIZE) erasePixel(x, y); return; }
  sel = (x < 0 || y < 0 || x >= SIZE || y >= SIZE) ? null : { x, y };
  if (sel && scale < 8) {                                      // too small to place accurately: zoom in on it
    scale = 12; tx = view.clientWidth / 2 - (sel.x + 0.5) * scale; ty = view.clientHeight / 2 - (sel.y + 0.5) * scale; clampPan();
  } else if (sel) placePixel(x, y);                            // zoomed in enough to be precise: click places your color
  redraw(); updateUI();
}

function setErase(on) {
  eraseMode = on; $("eraseBtn").textContent = "Eraser: " + (on ? "on" : "off");
  $("eraseBtn").classList.toggle("on", on); view.classList.toggle("erasing", on);
  if (on) { sel = null; if (areaMode) setArea(false); if (drawMode) setDraw(false); cancelImport(); toast(adminOn ? "Eraser on: click any pixel to delete it" : "Eraser on: click one of your own pixels (outlined in red) to remove it"); }
  redraw(); updateUI();
}
$("eraseBtn").onclick = () => setErase(!eraseMode);

// ---- drag-to-draw: paint a line of pixels while dragging (batched, so a stroke is a few requests, not hundreds) ----
const drawActive = () => drawMode && !eraseMode && !areaMode && !impMode;
function setDraw(on) {
  drawMode = on; $("drawBtn").textContent = "Drag: " + (on ? "draw" : "move"); $("drawBtn").classList.toggle("on", on);
  view.classList.toggle("drawing", on);
  if (on) {
    if (eraseMode) setErase(false); if (areaMode) setArea(false); cancelImport(); sel = null;
    toast(scale < 4 ? "Draw mode: zoom in (4× or more), then drag to paint. Space or right-drag pans." : "Draw mode: drag to paint. Hold Space or right-drag to pan.");
  }
  redraw(); updateUI();
}
$("drawBtn").onclick = () => setDraw(!drawMode);
function extendStroke(p) {                                       // fill the gap between mouse events with a straight line
  const a = stroke.last || p; stroke.last = p;
  let x = a.x, y = a.y; const dx = Math.abs(p.x - x), dy = -Math.abs(p.y - y), sx = x < p.x ? 1 : -1, sy = y < p.y ? 1 : -1; let err = dx + dy;
  for (;;) {
    strokePixel(x, y);
    if (x === p.x && y === p.y) break;
    const e2 = 2 * err; if (e2 >= dy) { err += dy; x += sx; } if (e2 <= dx) { err += dx; y += sy; }
  }
}
function strokePixel(x, y) {
  if (!ready || !API_URL || API_URL.includes("YOUR-SUBDOMAIN")) return;
  if (scale < 4) { if (!stroke.warned) { stroke.warned = true; toast("Zoom in to 4× or more to draw."); } return; }
  const idx = y * SIZE + x, key = x + "_" + y;
  if (!adminOn) {
    if (taken.has(key)) return;                                  // never paint over someone's pixel (or your own)
    if (used >= MAX) { if (!stroke.warned) { stroke.warned = true; toast(`You've used all ${MAX} pixels. Erase one to place another.`); } return; }
    used++;
  } else if (colors[idx] === color) return;
  strokeQueue.push([x, y, color, colors[idx]]);
  draw(x, y, color);                                             // optimistic: shows instantly, rolled back if the server says no
  updateUI();
}
let flushing = false;
async function flushStrokes() {
  if (flushing || !strokeQueue.length) return;
  flushing = true;
  while (strokeQueue.length) {
    const batch = strokeQueue.splice(0, 500);
    const undo = items => { for (const [x, y, , prev] of items) { if (prev < 0) draw(x, y, -1); else draw(x, y, prev); } };
    try {
      if (adminOn) {
        const r = await adm("/admin/import", { pixels: batch.map(b => [b[0], b[1], b[2]]), overwrite: true });
        if (!r.ok) { undo(batch); toast(r.error || "Couldn't place pixels"); }
      } else {
        const res = await fetch(`${API_URL}/place-many`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pixels: batch.map(b => [b[0], b[1], b[2]]) }) });
        const r = await res.json().catch(() => ({}));
        if (!res.ok) { undo(batch); used = Math.max(0, used - batch.length); toast(r.error || "Couldn't place pixels"); continue; }
        const ok = new Set(r.placed.map(q => q[1] * SIZE + q[0]));
        const lost = batch.filter(b => !ok.has(b[1] * SIZE + b[0]));
        for (const b of batch) if (ok.has(b[1] * SIZE + b[0])) mine.add(b[1] * SIZE + b[0]);
        undo(lost);
        used = r.used;
        if (lost.length) toast(`${lost.length} pixel${lost.length === 1 ? " was" : "s were"} not placed (already taken or limit reached).`);
      }
    } catch (e) { undo(batch); if (!adminOn) used = Math.max(0, used - batch.length); toast("Network error. Pixels rolled back."); }
  }
  flushing = false; updateUI();
}
setInterval(flushStrokes, 250);

// ---- admin (secret token lives in the Worker; this page only stores what you type) ----
const adm = async (path, body) => {
  const res = await fetch(`${API_URL}${path}`, { method: "POST", headers: { "Content-Type": "application/json", "X-Admin-Token": adminToken }, body: JSON.stringify(body) });
  return { ok: res.ok, status: res.status, ...(await res.json().catch(() => ({}))) };
};
const checkToken = async t => { try { return (await fetch(`${API_URL}/admin/check`, { method: "POST", headers: { "Content-Type": "application/json", "X-Admin-Token": t }, body: "{}" })).ok; } catch (e) { return false; } };
const adminPanel = $("adminPanel");
function toggleAdminPanel() { picker.classList.remove("open"); adminPanel.classList.toggle("open"); }
function setAdmin(on, t) {
  adminOn = on; adminToken = on ? t : "";
  if (on) localStorage.setItem("pc_admin_token", t); else localStorage.removeItem("pc_admin_token");
  $("adminBtn").style.display = on ? "" : "none";
  if (!on) { adminPanel.classList.remove("open"); setArea(false); cancelImport(); }
  updateUI();
}
async function unlockAdmin() {
  const t = (prompt("Admin token:") || "").trim(); if (!t) return;
  if (await checkToken(t)) { setAdmin(true, t); toast("Admin mode on. Click the Admin button for tools."); } else toast("Wrong token");
}
$("adminBtn").onclick = toggleAdminPanel;
$("admOut").onclick = () => { setAdmin(false); toast("Admin locked"); };
document.querySelector("header h1").addEventListener("dblclick", () => { if (!adminOn) unlockAdmin(); });
for (const el of adminPanel.querySelectorAll("input")) el.addEventListener("keydown", e => e.stopPropagation());
document.addEventListener("pointerdown", e => { if (!adminPanel.contains(e.target) && !$("adminBtn").contains(e.target)) adminPanel.classList.remove("open"); });
(async () => { const t = localStorage.getItem("pc_admin_token"); if (t) { if (await checkToken(t)) setAdmin(true, t); else localStorage.removeItem("pc_admin_token"); } })();

// area erase: drag a box, confirm, everything inside is removed (whoever placed it)
function setArea(on) {
  areaMode = on; area = null; $("areaBtn").textContent = "Erase area: " + (on ? "on (drag a box)" : "off"); $("areaBtn").classList.toggle("on", on);
  view.classList.toggle("erasing", on || eraseMode);
  if (on) { if (eraseMode) setErase(false); if (drawMode) setDraw(false); cancelImport(); adminPanel.classList.remove("open"); toast("Drag a box over the pixels to delete. Esc cancels."); }
  redraw();
}
$("areaBtn").onclick = () => setArea(!areaMode);
async function finishArea() {
  const a = area; area = null; if (!a) return;
  const x0 = Math.min(a.a.x, a.b.x), x1 = Math.max(a.a.x, a.b.x), y0 = Math.min(a.a.y, a.b.y), y1 = Math.max(a.a.y, a.b.y);
  let n = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (colors[y * SIZE + x] >= 0) n++;
  redraw();
  if (!n) return toast("No pixels in that area.");
  if (!confirm(`Delete ${n} pixel${n === 1 ? "" : "s"} in this area (${x1 - x0 + 1}×${y1 - y0 + 1})? Anyone's pixels will be removed.`)) return;
  const r = await adm("/admin/erase", { x0, y0, x1, y1 });
  if (!r.ok) return toast(r.error || "Couldn't erase");
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (colors[y * SIZE + x] >= 0) draw(x, y, -1);
  toast(`Erased ${r.erased} pixels`);
}

// image import
$("impPick").onclick = () => $("impFile").click();
let impBitmap = null;
$("impFile").onchange = async () => {
  const f = $("impFile").files[0]; if (!f) return;
  try { impBitmap = await createImageBitmap(f); } catch (e) { return toast("Couldn't read that image"); }
  $("impW").value = Math.min(impBitmap.width, 100); $("impOpts").style.display = "flex"; $("impOpts").style.flexDirection = "column"; $("impOpts").style.gap = "8px";
  buildImport(); $("impFile").value = "";
};
$("impW").oninput = buildImport;
const IMP_MAX = 25000;
function buildImport() {
  if (!impBitmap) return;
  const w = Math.max(1, Math.min(SIZE, Math.round(+$("impW").value) || 1));
  const h = Math.max(1, Math.min(SIZE, Math.round(impBitmap.height * w / impBitmap.width)));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = w < impBitmap.width; g.imageSmoothingQuality = "high";
  g.drawImage(impBitmap, 0, 0, w, h);
  const id = g.getImageData(0, 0, w, h); let n = 0;
  for (let i = 0; i < id.data.length; i += 4) { if (id.data[i + 3] >= 128) { id.data[i + 3] = 255; n++; } else id.data[i + 3] = 0; }   // transparent stays transparent
  g.putImageData(id, 0, 0);
  imp = { w, h, data: id.data, n }; impCv = c;
  $("impInfo").textContent = `${w}×${h} px · ${n.toLocaleString()} pixels` + (n > IMP_MAX ? ` — too many (max ${IMP_MAX.toLocaleString()} per import; the free database allows ~100k writes/day, ~3 per pixel)` : "");
  $("impGo").disabled = n > IMP_MAX || n === 0;
}
$("impGo").onclick = () => {
  if (!imp) return;
  if (eraseMode) setErase(false); if (areaMode) setArea(false); if (drawMode) setDraw(false);
  impMode = true; impPos = impOrigin({ x: Math.floor(SIZE / 2), y: Math.floor(SIZE / 2) }); adminPanel.classList.remove("open");
  toast("Move over the canvas and click to place the image (Esc cancels)"); redraw();
};
const impOrigin = p => ({ x: Math.max(0, Math.min(SIZE - imp.w, p.x - (imp.w >> 1))), y: Math.max(0, Math.min(SIZE - imp.h, p.y - (imp.h >> 1))) });
function cancelImport() { impMode = false; impPos = null; redraw(); }
let importing = false;
async function confirmImport() {
  if (!impMode || !imp || importing) return;
  const { x: ox, y: oy } = impPos, over = $("impOver").checked, list = [];
  for (let j = 0; j < imp.h; j++) for (let i = 0; i < imp.w; i++) {
    const k = (j * imp.w + i) * 4; if (imp.data[k + 3] < 128) continue;
    list.push([ox + i, oy + j, (imp.data[k] << 16) | (imp.data[k + 1] << 8) | imp.data[k + 2]]);
  }
  if (!confirm(`Place this image (${imp.w}×${imp.h}, ${list.length.toLocaleString()} pixels) at (${ox}, ${oy})?${over ? " It will overwrite existing pixels." : " Existing pixels are kept."}`)) return;
  importing = true;
  try {
    for (let i = 0; i < list.length; i += 2000) {
      toast(`Uploading… ${Math.min(i + 2000, list.length).toLocaleString()} / ${list.length.toLocaleString()}`);
      const r = await adm("/admin/import", { pixels: list.slice(i, i + 2000), overwrite: over });
      if (!r.ok) { toast(r.error || "Import failed"); importing = false; return; }
    }
    for (const [x, y, c] of list) if (over || colors[y * SIZE + x] < 0) draw(x, y, c);
    toast("Image placed!"); cancelImport();
  } catch (e) { toast("Network error during import"); }
  importing = false;
}

// ---- backend (Cloudflare Worker) ----
import { API_URL } from "./config.js";
let used = 0, ready = false, lastId = 0;
let erasePixel = () => {}, placePixel = () => {};
const pending = new Set();
const taken = new Set();

function updateUI() {
  const left = MAX - used;
  statusEl.textContent = !ready ? "Connecting…" : (adminOn ? "Admin · unlimited pixels" : `${left} of ${MAX} pixels left`) + (sel ? ` · (${sel.x}, ${sel.y})` : "");
}

setColor(color); resize(); fit(); window.addEventListener("resize", () => { resize(); clampPan(); });

function draw(x, y, c) {
  if (c < 0) { taken.delete(x + "_" + y); mine.delete(y * SIZE + x); }      // erased
  else taken.add(x + "_" + y);
  colors[y * SIZE + x] = c; redraw();
}

async function sync() {
  if (document.hidden && ready) return;
  try {
    let more = true;
    while (more) {
      const r = await (await fetch(`${API_URL}/pixels?since=${lastId}`, { cache: "no-store" })).json();
      for (let i = 0; i < r.p.length; i += 4) { draw(r.p[i + 1], r.p[i + 2], r.p[i + 3]); lastId = r.p[i]; }
      more = r.more;
    }
    if (!ready) {
      used = (await (await fetch(`${API_URL}/me`, { cache: "no-store" })).json()).used;
      const m = (await (await fetch(`${API_URL}/mine`, { cache: "no-store" })).json()).m;
      for (let i = 0; i < m.length; i += 2) mine.add(m[i + 1] * SIZE + m[i]);
      ready = true;
    }
    updateUI();
  } catch (e) { statusEl.textContent = "Connection problem – retrying…"; }
}

if (API_URL.includes("YOUR-SUBDOMAIN")) {
  statusEl.textContent = "Not configured – see README.md";
} else {
  sync(); setInterval(sync, 3000);
  placePixel = async (x, y) => {
    const key = x + "_" + y;
    if (!ready || pending.has(key)) return;
    if (adminOn) {                                              // admin: no limit, can overwrite
      pending.add(key);
      try { const r = await adm("/admin/place", { x, y, c: color }); if (r.ok) draw(x, y, color); else toast(r.error || "Couldn't place pixel"); }
      catch (e) { toast("Network error"); }
      pending.delete(key); return;
    }
    if (used >= MAX) return toast(`You've used all ${MAX} pixels. Erase one to place another.`);
    if (taken.has(key)) return toast("That pixel is already taken.");
    pending.add(key);
    try {
      const res = await fetch(`${API_URL}/place`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ x, y, c: color, v: 2 }) });
      const r = await res.json();
      if (r.used !== undefined) used = r.used;
      if (res.ok) { draw(x, y, color); mine.add(y * SIZE + x); }
      else { if (res.status === 409) taken.add(key); toast(r.error || "Couldn't place pixel"); }
    } catch (e) { toast("Network error"); }
    pending.delete(key); updateUI();
  };
  erasePixel = async (x, y) => {
    if (adminOn) {                                              // admin: erase anyone's pixel
      if (!taken.has(x + "_" + y)) return toast("Nothing to erase there.");
      try { const r = await adm("/admin/erase", { x0: x, y0: y, x1: x, y1: y }); if (r.ok) { draw(x, y, -1); toast("Erased (admin)"); } else toast(r.error || "Couldn't erase"); }
      catch (e) { toast("Network error"); }
      return;
    }
    if (!mine.has(y * SIZE + x)) return toast(taken.has(x + "_" + y) ? "That's someone else's pixel. You can only erase your own." : "Nothing to erase there.");
    try {
      const res = await fetch(`${API_URL}/erase`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ x, y }) });
      const r = await res.json();
      if (r.used !== undefined) used = r.used;
      if (res.ok) { draw(x, y, -1); toast("Erased"); } else toast(r.error || "Couldn't erase");
    } catch (e) { toast("Network error"); }
    updateUI();
  };
}
updateUI();
</script>
</body>
</html>
